<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハピクル英語塾 単語テスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ローディング -->
<div id="screen-loading" class="screen active">
  <div class="loading-content">
    <div class="logo">🌸 ハピクル英語塾</div>
    <div class="loading-spinner"></div>
  </div>
</div>

<!-- ログイン・新規登録 -->
<div id="screen-login" class="screen">
  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="logo">🌸 ハピクル英語塾</div>
      <div class="subtitle">英検準1級 単語テスト</div>
    </div>

    <!-- ログインフォーム -->
    <div id="form-login" class="auth-form">
      <h2 class="auth-title">ログイン</h2>
      <input type="email" id="login-email" class="auth-input" placeholder="メールアドレス" autocomplete="email">
      <input type="password" id="login-password" class="auth-input" placeholder="パスワード" autocomplete="current-password">
      <div class="auth-error hidden" id="login-error"></div>
      <button class="btn btn-primary btn-full" id="btn-login">ログイン</button>
      <p class="auth-switch">アカウントをお持ちでない方は
        <a href="#" id="show-signup">新規登録</a>
      </p>
    </div>

    <!-- 新規登録フォーム -->
    <div id="form-signup" class="auth-form hidden">
      <h2 class="auth-title">新規登録</h2>
      <input type="text" id="signup-name" class="auth-input" placeholder="お名前（例：田中 太郎）" autocomplete="name">
      <input type="email" id="signup-email" class="auth-input" placeholder="メールアドレス" autocomplete="email">
      <input type="password" id="signup-password" class="auth-input" placeholder="パスワード（6文字以上）" autocomplete="new-password">
      <div class="auth-error hidden" id="signup-error"></div>
      <button class="btn btn-primary btn-full" id="btn-signup">登録する</button>
      <p class="auth-switch">すでにアカウントをお持ちの方は
        <a href="#" id="show-login">ログイン</a>
      </p>
    </div>
  </div>
</div>

<!-- ホーム画面 -->
<div id="screen-home" class="screen">
  <div class="home-header">
    <div>
      <div class="logo">🌸 ハピクル英語塾</div>
      <div class="subtitle">英検準1級 単語テスト</div>
    </div>
    <div class="home-header-right">
      <span class="user-name" id="home-username"></span>
      <button id="btn-logout" class="btn btn-secondary btn-small">ログアウト</button>
    </div>
  </div>

  <div class="section-grid" id="section-grid"></div>

  <div class="home-footer">
    <button id="btn-review-all" class="btn btn-review">
      ⭐ バツのみ復習モード
    </button>
    <button id="btn-reset" class="btn btn-secondary btn-small">
      データリセット
    </button>
  </div>
</div>

<!-- モード選択 -->
<div id="screen-mode" class="screen">
  <div class="mode-header">
    <button class="back-btn" id="btn-back-home">← 戻る</button>
    <h2 id="mode-section-title"></h2>
  </div>
  <div class="mode-stats" id="mode-stats"></div>
  <div class="mode-buttons">
    <button class="btn btn-primary btn-large" id="btn-start-normal">▶ テスト開始（全問）</button>
    <button class="btn btn-review btn-large" id="btn-start-review">⭐ バツのみ復習</button>
  </div>
</div>

<!-- テスト画面 -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <button class="back-btn" id="btn-back-mode">← 戻る</button>
    <div class="quiz-info">
      <span id="quiz-section-label"></span>
      <span id="quiz-mode-label"></span>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>
  <div class="progress-text" id="progress-text"></div>
  <div class="quiz-card">
    <div class="word-display" id="word-display"></div>
    <div class="word-no" id="word-no"></div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="quiz-result hidden" id="quiz-result"></div>
</div>

<!-- 完了画面 -->
<div id="screen-complete" class="screen">
  <div class="complete-content">
    <div class="complete-icon">🎉</div>
    <h2 id="complete-title"></h2>
    <div class="complete-stats" id="complete-stats"></div>
    <div class="complete-buttons">
      <button class="btn btn-primary" id="btn-complete-retry">もう一度</button>
      <button class="btn btn-secondary" id="btn-complete-home">ホームへ</button>
    </div>
  </div>
</div>

<!-- 管理画面 -->
<div id="screen-admin" class="screen">
  <div class="admin-header">
    <div>
      <div class="logo">🌸 管理画面</div>
      <div class="subtitle" id="admin-teacher-name"></div>
    </div>
    <button id="btn-admin-logout" class="btn btn-secondary btn-small">ログアウト</button>
  </div>

  <div class="admin-stats-bar" id="admin-stats-bar"></div>

  <div class="admin-toolbar">
    <input type="text" id="admin-search" class="admin-search" placeholder="生徒名で検索...">
    <button class="btn btn-secondary btn-small" id="btn-admin-refresh">🔄 更新</button>
  </div>

  <div id="admin-table-wrap">
    <p class="loading-text">データを読み込み中...</p>
  </div>
</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
